<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | JoshElectric Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/dark-mode.css" id="theme-style" disabled>
</head>
<body>
    <header class="top-navbar">
        <div class="nav-brand">
            <a href="../index.html" class="nav-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <div class="brand-logo">
                <svg width="36" height="36" viewBox="0 0 40 40">
                    <rect width="40" height="40" rx="10" fill="#1e3a8a"/>
                    <text x="20" y="28" text-anchor="middle" fill="white" font-size="22" font-weight="900">J</text>
                    <circle cx="32" cy="8" r="4" fill="#f59e0b"/>
                </svg>
                <span>JoshElectric<span class="brand-highlight"> Control</span></span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="../index.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="multi-user.html" class="nav-link active"><i class="fas fa-users"></i> Users</a>
            <a href="settings.html" class="nav-link"><i class="fas fa-cog"></i> Settings</a>
        </nav>
    </header>

    <div class="main-container">
        <main class="main-content">
            <div class="page-header">
                <h1><i class="fas fa-users-cog"></i> User Management</h1>
                <p>Manage system users and role-based access</p>
            </div>

            <div class="card" id="adminOnly" style="display:none;">
                <div class="card-header">
                    <h2><i class="fas fa-user-plus"></i> Add New User</h2>
                </div>
                <div class="card-body">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" id="newFirstName" class="form-control" placeholder="John">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="newLastName" class="form-control" placeholder="Doe">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="newEmail" class="form-control" placeholder="user@example.com">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 chars">
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select id="newRole" class="form-control">
                                <option value="client">Client</option>
                                <option value="engineer">Engineer</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addNewUser()">
                        <i class="fas fa-user-plus"></i> Add User
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-list"></i> System Users</h2>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Created</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="7" class="text-center">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="notification-container" id="notificationContainer"></div>

    <script src="../js/config.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/multi-user.js"></script>
</body>
</html>
